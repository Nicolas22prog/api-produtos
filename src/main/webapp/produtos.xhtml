<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      >
    
<h:head>
    <title>Produtos</title>
</h:head>    
<h:body>
    <h1>Usuario</h1>
    <h:form>
        <p id="usuario">Olá, #{userBean.userLogado.usuario}</p>
    </h:form>
    <h1>Cadastro de Produto</h1>      
    <h:form>
        <p:panelGrid columns="2">
            Nome: <p:inputText value="#{productManagedBean.product.nome}" />
            Preço: <p:inputText value="#{productManagedBean.product.preco}" />
            Quantidade: <p:inputText value="#{productManagedBean.product.quantidade}"/>
            <p:commandButton value="Salvar" action="#{productManagedBean.salvar}"/>
            
        </p:panelGrid>
    </h:form>
    <h2> Gerenciamento do banco de dados</h2>
    <h:form>
        <p:panelGrid columns="2" >
            Importar produtos: <p:commandButton value="Importar produtos Json" 
                                                action="#{productManagedBean.importarJson}"
                                                process="@this" update="@form"/>
            Importar produtos: <p:commandButton value="Importar produtos Csv" 
                                                action="#{productManagedBean.importarCsv}"
                                                process="@this" update="@form"/>
            Deletar todos os produtos: <p:commandButton value="Deletar todos os produtos" 
                                                        action="#{productManagedBean.deletarTodos}"
                                                        process="@this" update="@form"/>
            
        </p:panelGrid>
    </h:form>
    
    <h2>Listar Produtos</h2>
     <h:form>
         <p:dataTable value="#{productManagedBean.lazyModel}" var="p"
                      paginator="true" rows="150" lazy="true" id="produtos">
            <p:column>
                <f:facet name="header">ID</f:facet>
                #{p.id}
            </p:column>
            <p:column>
                <f:facet name="header">Nome</f:facet>
                #{p.nome}
            </p:column>            
            <p:column>
                <f:facet name="header">Preço</f:facet>
                #{p.preco}
            </p:column>
            <p:column>
                <f:facet name="header">Quantidade</f:facet>
                #{p.quantidade}
            </p:column>
            <p:column>
                <f:facet name="header">Ações</f:facet>
                <p:commandButton value="Excluir" action="#{productManagedBean.remover(p)}"
                                 onclick="return confirm('Tem certeza que deseja excluir?');"/>
                <p:commandButton value="Editar" action="#{productManagedBean.prepararEdicao(p.id)}"/>
                
            </p:column>

        </p:dataTable>
        </h:form>
</h:body>
</html>
