<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      >
    <h:head>
        <title>Editar Produto</title>
    </h:head>
    <h:body>
        <h:form>
            <p:panelGrid columns="2">
                Nome: 
                <p:inputText value="#{productManagedBean.produtoSelecionado.nome}"/>
                
                Quantidade:
                <p:inputText value="#{productManagedBean.produtoSelecionado.quantidade}"/>
                
                Preço
                <p:inputText value="#{productManagedBean.produtoSelecionado.preco}"/>
                
                <p:commandButton value="Salvar" action="#{productManagedBean.salvarEdicao}"/>
                <p:commandButton value="Cancelar" action="produtos.xhtml?faces-redirect=true" immediate="true"/>
                <p:inputText value="#{productManagedBean.produtoSelecionado.id}"/>
            </p:panelGrid>
        </h:form>
    </h:body>
</html>
