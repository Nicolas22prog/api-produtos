<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      
      xmlns:p="http://primefaces.org/ui"
      >
      
<h:head>
    <title>Login</title>
</h:head>

<h:body>
    <h:form>
        <p:panelGrid columns="2">
            <h:outputLabel value="Usuário:" for="usuario"/>
            <h:inputText id="usuario" value="#{userBean.user.usuario}" />

            <h:outputLabel value="Senha:" for="senha"/>
            <h:inputSecret id="senha" value="#{userBean.user.senha}" />

            <p:commandButton value="Entrar" action="#{userBean.entrar}" />
            <p:commandButton value="cadastrar" action="#{userBean.cadastrar}"/>
        </p:panelGrid>
    </h:form>
</h:body>
</html>
